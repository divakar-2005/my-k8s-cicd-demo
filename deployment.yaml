apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
    spec:
      containers:
      - name: web-demo
        image: k8s-cicd-demo:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-demo-service
spec:
  type: NodePort
  selector:
    app: web-demo
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
